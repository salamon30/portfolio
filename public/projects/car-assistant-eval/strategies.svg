  <g class="note"><line class="noteline" x1="606.2" y1="273.7" x2="649.2" y2="297.7"/><text class="notetext" x="653.2" y="303.7">D finds 2.2× more bugs</text><text class="notesub" x="653.2" y="319.7">than A on a small budget</text></g>
  <line class="line s0 static" x1="60" x2="82" y1="418" y2="418"/><text class="leg" x="90" y="422">A · only level 2</text>
