  <polyline class="line s3 d3" pathLength="1" points="60.0,350.0 87.5,318.8 115.0,286.6 142.5,259.5 170.0,232.5 197.5,202.8 225.0,175.9 252.5,148.6 280.0,122.1 307.5,118.2 335.0,116.1 362.5,111.8 390.0,110.8"/>
